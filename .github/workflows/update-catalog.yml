name: Update catalog

on:
  # раз в сутки в 04:00 UTC
  schedule:
    - cron: "0 4 * * *"
  # при любом изменении main
  #
  # Раньше здесь стоял фильтр paths (curated.json, feeds.json, scripts/**).
  # Он молча съел деплой: коммит с 2211 вырезками менял 4431 файл, а GitHub
  # обрезает список файлов в push-событии, и правки в scripts/ в него не
  # попали — фильтр не сработал, сборка не запустилась, сайт три часа отдавал
  # старый каталог. Пропущенный деплой дороже лишней сборки, поэтому фильтра
  # больше нет.
  push:
    branches: [ main ]
  # кнопка «Run workflow» в интерфейсе
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog.json
        run: python scripts/build_catalog.py

      # Картинки AI-примерок (products/) публикуем вместе с каталогом,
      # чтобы приложение тянуло их по сети, а не из APK.
      - name: Copy try-on images
        run: |
          mkdir -p public/products
          if [ -d products ]; then cp -r products/. public/products/ ; fi
          echo "try-on images: $(ls -1 public/products 2>/dev/null | wc -l)"

      - name: Show result
        run: |
          echo "--- public/catalog.json ---"
          head -c 600 public/catalog.json
          echo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
