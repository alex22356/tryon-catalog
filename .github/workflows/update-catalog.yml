name: Update catalog

on:
  # раз в сутки в 04:00 UTC
  schedule:
    - cron: "0 4 * * *"
  # при правке товаров вручную
  push:
    branches: [ main ]
    paths:
      - "curated.json"
      - "feeds.json"
      - "scripts/**"
      - ".github/workflows/update-catalog.yml"
  # кнопка «Run workflow» в интерфейсе
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog.json
        run: python scripts/build_catalog.py

      - name: Show result
        run: |
          echo "--- public/catalog.json ---"
          head -c 600 public/catalog.json
          echo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
